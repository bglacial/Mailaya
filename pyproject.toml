[project]
name = "mailaya"
version = "0.1.0"
description = "Triage local de messages Gmail avec LAYA MLX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "google-auth>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2",
  "uvicorn[standard]>=0.30,<1",
  "laya-mlx>=0.1.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
